name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

env:
  # Same version as the ECC Upshift Agents workspace.
  UPSHIFT_VERSION: v2.47.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback, no test instance needed.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Build the app and check its manifest
        run: yarn upshift dev:build

  # The test-instance action, its input and the CLI package keep their upstream SDK names.
  # The action is pinned to a commit of the upstream main branch: update the SHA by hand.
  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spawn Upshift test instance
        id: upshift
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@99d3f780c49ed72925daa67f282e8c60bdd35aba # main, 2026-10-23
        with:
          twenty-version: ${{ env.UPSHIFT_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install the Upshift CLI
        # Newest CLI release not above the workspace version (there is no 2.47.0).
        run: npm install -g twenty@2.46.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run integration tests
        run: yarn test
        env:
          UPSHIFT_API_URL: ${{ steps.upshift.outputs.server-url }}
          UPSHIFT_API_KEY: ${{ steps.upshift.outputs.api-key }}
