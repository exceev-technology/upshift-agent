name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

env:
  # Same version as the ECC Upshift Agents workspace.
  UPSHIFT_VERSION: v2.47.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The test-instance action, its input and the CLI package keep their upstream SDK names.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spawn Upshift test instance
        id: upshift
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@main
        with:
          twenty-version: ${{ env.UPSHIFT_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install the Upshift CLI
        # Newest CLI release not above the workspace version (there is no 2.47.0).
        run: npm install -g twenty@2.46.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Run integration tests
        run: yarn test
        env:
          UPSHIFT_API_URL: ${{ steps.upshift.outputs.server-url }}
          UPSHIFT_API_KEY: ${{ steps.upshift.outputs.api-key }}
