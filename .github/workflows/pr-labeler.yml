name: PR labeler

# Labels pull requests from their branch name and changed files (.github/labeler.yml).
# pull_request_target is safe here: the labeler reads its configuration from main and never runs the pull request's code.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label the pull request
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
