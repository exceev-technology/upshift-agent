# Libellés du dépôt, synchronisés par .github/workflows/labels.yml à chaque modification sur main.
# Renommer : ajoutez `from_name` avec l'ancien nom pour garder les issues déjà étiquetées.

# Type
- name: "type: fonctionnalité"
  color: "1d76db"
  description: "Nouvelle capacité ou story utilisateur"
  from_name: "enhancement"
- name: "type: bug"
  color: "d73a4a"
  description: "Comportement inattendu ou erreur"
  from_name: "bug"
- name: "type: tâche"
  color: "0e8a16"
  description: "Travail technique, configuration ou maintenance"
- name: "type: documentation"
  color: "0075ca"
  description: "Documentation, README ou wiki"
  from_name: "documentation"
- name: "type: apprentissage"
  color: "5319e7"
  description: "Découverte et montée en compétence de l'équipe"
- name: "type: sécurité"
  color: "b60205"
  description: "Correctif ou durcissement de sécurité"

# Priorité
- name: "priorité: P0 critique"
  color: "b60205"
  description: "Bloque la démo ou le sprint : à traiter immédiatement"
- name: "priorité: P1 haute"
  color: "d93f0b"
  description: "Nécessaire à l'objectif du sprint"
- name: "priorité: P2 moyenne"
  color: "fbca04"
  description: "Utile, à planifier"
- name: "priorité: P3 basse"
  color: "c2e0c6"
  description: "Amélioration, si le temps le permet"

# Taille (estimation en Sprint Planning)
- name: "taille: XS"
  color: "ededed"
  description: "Moins de 2 heures"
- name: "taille: S"
  color: "d4e5f9"
  description: "Une demi-journée"
- name: "taille: M"
  color: "a2c4f0"
  description: "Une journée"
- name: "taille: L"
  color: "6f9fe0"
  description: "Deux jours"
- name: "taille: XL"
  color: "3e6cc4"
  description: "Plus de deux jours : à découper avant le sprint"

# Zone du code
- name: "zone: agents"
  color: "c5def5"
  description: "Agents A à D et leurs fiches"
- name: "zone: skills"
  color: "c5def5"
  description: "Skills S1 à S8 et leurs contrats"
- name: "zone: catalogue"
  color: "c5def5"
  description: "Catalogue, rendu des prompts et des skills"
- name: "zone: contrats"
  color: "f9d0c4"
  description: "Contrat d'action, checkActionProposal, registre des actions"
- name: "zone: rôles"
  color: "f9d0c4"
  description: "Rôle de l'application et délégations des agents"
- name: "zone: modèles IA"
  color: "d4c5f9"
  description: "Jev, modèles génératifs, fournisseurs IA de l'espace"
- name: "zone: fonctions"
  color: "c5def5"
  description: "Fonctions, outils des agents et déclencheurs"
- name: "zone: CRM"
  color: "c5def5"
  description: "Objets, champs, vues et pages du CRM"
- name: "zone: supervision"
  color: "c5def5"
  description: "Simulation, pause, reprise, journal et validations"
- name: "zone: docs"
  color: "0075ca"
  description: "Documentation du dépôt et wiki"
- name: "zone: CI"
  color: "bfdadc"
  description: "Workflows GitHub Actions et automatisations"
- name: "zone: dépendances"
  color: "0366d6"
  description: "Dépendances npm et actions GitHub"

# Scénarios de la démo
- name: "scénario 1 · analyser"
  color: "fef2c0"
  description: "Rechercher, qualifier, proposer une priorité"
- name: "scénario 2 · agir"
  color: "fef2c0"
  description: "Écrire dans le CRM, déclencher une action préautorisée"
- name: "scénario 3 · coordonner"
  color: "fef2c0"
  description: "Faire passer un dossier entre agents jusqu'à une issue documentée"

# Statut
- name: "statut: à trier"
  color: "ffffff"
  description: "Nouvelle issue, à qualifier par le Product Owner"
- name: "statut: prêt"
  color: "0e8a16"
  description: "Claire, estimée, critères d'acceptation écrits : peut entrer dans un sprint"
- name: "statut: bloqué"
  color: "b60205"
  description: "Attend une décision, un accès ou une autre issue"
- name: "statut: besoin d'infos"
  color: "d876e3"
  description: "Il manque des informations pour avancer"
  from_name: "question"
- name: "statut: doublon"
  color: "cfd3d7"
  description: "Déjà couvert par une autre issue ou PR"
  from_name: "duplicate"
- name: "statut: invalide"
  color: "e4e669"
  description: "Ne correspond pas à un problème ou à un besoin"
  from_name: "invalid"
- name: "statut: ne sera pas fait"
  color: "ffffff"
  description: "Écarté, avec la raison en commentaire"
  from_name: "wontfix"

# Communauté (noms reconnus par GitHub, à garder en anglais)
- name: "good first issue"
  color: "7057ff"
  description: "Idéal pour une première contribution"
- name: "help wanted"
  color: "008672"
  description: "Toute aide est bienvenue"
